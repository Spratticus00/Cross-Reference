<title>Cross Reference</title>
<style>html,body{margin:0;height:100%;background:#23211f}</style>
<script>
  // pick the layout: phones and small tablets get the phone layout
  var q = location.search, pick = /[?&]v=desktop/.test(q) ? 'desktop' : /[?&]v=mobile/.test(q) ? 'mobile' : null;
  try { if (!pick) pick = localStorage.getItem('crx-layout'); } catch (e) {}
  if (!pick) pick = (Math.min(screen.width, screen.height) < 820 || matchMedia('(max-width: 900px)').matches) ? 'mobile' : 'desktop';
  location.replace(pick + '.html');
</script></head><body></body></html>
